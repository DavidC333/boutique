<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique Sale</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream:#f7f3ee; --dark:#1a1410; --gold:#b8935a; --gold-light:#d4aa72; --muted:#8a7968; --border:#e2d9ce; --card-bg:#fff; --badge:#c44b3a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); color:var(--dark); font-family:'DM Sans',sans-serif; font-weight:300; }
  .lang-bar { background:var(--dark); display:flex; justify-content:flex-end; gap:4px; padding:8px 32px; }
  .lang-btn { background:none; border:1px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.6); font-size:11px; letter-spacing:0.08em; padding:3px 10px; cursor:pointer; border-radius:2px; transition:all 0.2s; font-family:'DM Sans',sans-serif; }
  .lang-btn.active,.lang-btn:hover { background:var(--gold); border-color:var(--gold); color:#fff; }
  header { background:var(--dark); padding:32px 32px 28px; text-align:center; }
  header::after { content:''; display:block; height:3px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin-top:28px; }
  .store-name { font-family:'Cormorant Garamond',serif; font-size:clamp(32px,6vw,52px); font-weight:300; color:var(--cream); letter-spacing:0.12em; }
  .store-sub { font-size:11px; letter-spacing:0.25em; color:var(--gold); margin-top:8px; text-transform:uppercase; }
  .cart-bar { position:sticky; top:0; z-index:100; background:var(--card-bg); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:12px 32px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
  .cart-info { font-size:13px; color:var(--muted); }
  .cart-count-badge { display:inline-flex; align-items:center; justify-content:center; background:var(--badge); color:#fff; font-size:11px; font-weight:500; border-radius:50%; width:20px; height:20px; margin-left:6px; }
  .order-btn { background:var(--gold); color:#fff; border:none; padding:10px 24px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border-radius:2px; white-space:nowrap; }
  .order-btn:hover { background:var(--gold-light); }
  .order-btn:disabled { background:#ccc; cursor:default; }
  main { max-width:1100px; margin:0 auto; padding:40px 24px 80px; }
  .loading-screen { text-align:center; padding:80px 24px; color:var(--muted); }
  .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .category-block { margin-bottom:52px; }
  .category-title { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:400; font-style:italic; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .product-card { background:var(--card-bg); border:1px solid var(--border); border-radius:4px; overflow:hidden; display:flex; flex-direction:column; transition:box-shadow 0.25s,transform 0.25s; animation:fadeUp 0.4s ease both; }
  .product-card:hover:not(.is-sold) { box-shadow:0 8px 32px rgba(0,0,0,0.1); transform:translateY(-3px); }
  .product-card.is-sold { opacity:0.5; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .product-img { width:100%; aspect-ratio:1; background:#f0ebe4; display:flex; align-items:center; justify-content:center; font-size:48px; flex-shrink:0; position:relative; overflow:hidden; }
  .product-img img { width:100%; height:100%; object-fit:cover; }
  .sold-ribbon { position:absolute; top:12px; right:-24px; background:var(--badge); color:#fff; font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; padding:3px 32px; transform:rotate(35deg); }
  .product-body { padding:14px; flex:1; display:flex; flex-direction:column; gap:4px; }
  .product-sku { font-size:10px; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; }
  .product-name { font-size:14px; font-weight:400; color:var(--dark); line-height:1.35; }
  .product-desc { font-size:12px; color:var(--muted); line-height:1.45; flex:1; }
  .product-price { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:600; color:var(--gold); margin-top:4px; }
  .add-btn { width:100%; padding:9px; background:var(--dark); color:var(--cream); border:none; font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:background 0.2s; margin-top:10px; border-radius:2px; }
  .add-btn:hover { background:var(--gold); }
  .sold-btn { width:100%; padding:9px; background:#eee; color:var(--muted); border:none; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin-top:10px; border-radius:2px; cursor:default; }
  .qty-control { display:flex; align-items:center; justify-content:space-between; margin-top:10px; background:#f7f3ee; border-radius:2px; }
  .qty-btn { background:none; border:none; width:34px; height:34px; font-size:18px; cursor:pointer; color:var(--dark); }
  .qty-btn:hover { background:var(--border); }
  .qty-num { font-size:13px; font-weight:500; min-width:24px; text-align:center; }
  .cart-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; }
  .cart-overlay.open { display:block; }
  .cart-panel { position:fixed; top:0; right:0; width:min(420px,100vw); height:100vh; background:var(--card-bg); box-shadow:-4px 0 40px rgba(0,0,0,0.15); display:flex; flex-direction:column; z-index:201; transform:translateX(100%); transition:transform 0.3s ease; }
  .cart-panel.open { transform:translateX(0); }
  .cart-panel-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .cart-panel-title { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:400; }
  .close-btn { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); }
  .cart-items-list { flex:1; overflow-y:auto; padding:16px 24px; }
  .cart-item { display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
  .cart-item-emoji { font-size:28px; }
  .cart-item-info { flex:1; }
  .cart-item-sku { font-size:10px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
  .cart-item-name { font-size:13px; font-weight:400; line-height:1.35; }
  .cart-item-price { font-size:12px; color:var(--muted); margin-top:2px; }
  .cart-item-remove { background:none; border:none; font-size:16px; color:var(--muted); cursor:pointer; }
  .cart-item-remove:hover { color:var(--badge); }
  .cart-total-block { padding:16px 24px; border-top:1px solid var(--border); }
  .cart-total-big { display:flex; justify-content:space-between; font-family:'Cormorant Garamond',serif; font-size:22px; margin:10px 0 16px; }
  .messenger-btn { display:block; width:100%; padding:14px; background:#0084FF; color:#fff; border:none; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; border-radius:3px; text-align:center; transition:opacity 0.2s; }
  .messenger-btn:hover { opacity:0.88; }
  .empty-cart { text-align:center; color:var(--muted); font-size:14px; padding:40px 0; }
  .empty-cart .big { font-size:40px; margin-bottom:12px; }
  .cart-contacts { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .contact-input { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:3px; font-family:'DM Sans',sans-serif; font-size:13px; background:var(--cream); color:var(--dark); outline:none; transition:border-color 0.2s; }
  .contact-input:focus { border-color:var(--gold); }
  .contact-input.error { border-color:var(--badge); }
  .order-sent { display:none; position:fixed; inset:0; background:rgba(26,20,16,0.92); z-index:300; align-items:center; justify-content:center; flex-direction:column; gap:16px; color:#fff; text-align:center; padding:32px; }
  .order-sent.show { display:flex; }
  .order-sent .big-check { font-size:64px; }
  .order-sent h2 { font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:300; }
  .order-sent p { font-size:14px; color:rgba(255,255,255,0.65); max-width:300px; line-height:1.6; }
  .order-sent button { margin-top:8px; background:var(--gold); color:#fff; border:none; padding:12px 28px; font-family:'DM Sans',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border-radius:2px; }
  footer { text-align:center; padding:28px; font-size:11px; color:var(--muted); letter-spacing:0.08em; border-top:1px solid var(--border); }
  @media(max-width:600px) { .cart-bar{padding:10px 16px;} main{padding:28px 14px 60px;} .lang-bar{padding:8px 16px;} }
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-btn" onclick="setLang('ge')">GE</button>
  <button class="lang-btn active" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('ru')">RU</button>
</div>
<header>
  <div class="store-name" data-t="storeName"></div>
  <div class="store-sub" data-t="storeSub"></div>
</header>
<div class="cart-bar">
  <div class="cart-info"><span data-t="cartLabel"></span><span class="cart-count-badge" id="cartCount">0</span></div>
  <button class="order-btn" id="openCartBtn" onclick="openCart()" disabled data-t="viewCart"></button>
</div>
<main id="catalog"><div class="loading-screen"><div class="spinner"></div><p>Загрузка товаров...</p></div></main>
<footer data-t="footer"></footer>
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-panel-header">
    <div class="cart-panel-title" data-t="yourOrder"></div>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items-list" id="cartItemsList"></div>
  <div class="cart-total-block">
    <div class="cart-total-big"><span data-t="total"></span><span id="cartTotalVal">₾0</span></div>
    <div class="cart-contacts">
      <input class="contact-input" type="text" id="orderName" data-t-placeholder="namePlaceholder">
      <input class="contact-input" type="tel" id="orderPhone" data-t-placeholder="phonePlaceholder">
    </div>
    <button class="messenger-btn" onclick="sendOrder()" data-t="orderViaMessenger"></button>
  </div>
</div>
<div class="order-sent" id="orderSent">
  <div class="big-check">✅</div>
  <h2 data-t="sentTitle"></h2>
  <p data-t="sentDesc"></p>
  <button onclick="dismissSent()" data-t="backToShop"></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const MESSENGER_URL = "https://www.messenger.com/e2ee/t/1192818532433919";

const firebaseConfig = {
  apiKey: "AIzaSyDsr51JFbm2HxwhorkUHnfVWOXRr5r4iy0",
  authDomain: "boutique-sale-2b5db.firebaseapp.com",
  projectId: "boutique-sale-2b5db",
  storageBucket: "boutique-sale-2b5db.firebasestorage.app",
  messagingSenderId: "227697473974",
  appId: "1:227697473974:web:56c7167a2e81648d05a917"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const T = {
  en: { storeName:"Boutique Clearance", storeSub:"Special sale · Everything must go", cartLabel:"Items in cart", viewCart:"View Order", yourOrder:"Your Order", total:"Total", orderViaMessenger:"📨 Send order via Messenger", footer:"Questions? Write us on Facebook Messenger", addToCart:"Add to cart", sold:"Sold out", emptyCart:"Your cart is empty", sentTitle:"Order sent!", sentDesc:"We'll confirm your order via Messenger shortly.", backToShop:"Continue shopping", namePlaceholder:"Your name", phonePlaceholder:"Phone number", nameRequired:"Please enter your name", orderMsg:"Hello! I would like to order:\n\n{items}\n\nTotal: ₾{total}\n\nName: {name}\nPhone: {phone}\nOrder ID: {orderId}", cats:{wallets:"Wallets & Bags",perfume:"Perfume & Beauty",accessories:"Accessories",other:"Other"} },
  ru: { storeName:"Распродажа", storeSub:"Специальная распродажа · Всё должно уйти", cartLabel:"Товаров в корзине", viewCart:"Смотреть заказ", yourOrder:"Ваш заказ", total:"Итого", orderViaMessenger:"📨 Отправить заказ через Messenger", footer:"Вопросы? Напишите нам в Facebook Messenger", addToCart:"В корзину", sold:"Продано", emptyCart:"Корзина пуста", sentTitle:"Заказ отправлен!", sentDesc:"Мы подтвердим ваш заказ в Messenger в ближайшее время.", backToShop:"Продолжить покупки", namePlaceholder:"Ваше имя", phonePlaceholder:"Номер телефона", nameRequired:"Пожалуйста, введите имя", orderMsg:"Здравствуйте! Я хотел бы заказать:\n\n{items}\n\nИтого: ₾{total}\n\nИмя: {name}\nТелефон: {phone}\nID заказа: {orderId}", cats:{wallets:"Кошельки и сумки",perfume:"Духи и красота",accessories:"Аксессуары",other:"Другое"} },
  ge: { storeName:"გაყიდვა", storeSub:"სპეციალური გაყიდვა · ყველაფერი უნდა გაიყიდოს", cartLabel:"პროდუქტი კალათაში", viewCart:"შეკვეთის ნახვა", yourOrder:"თქვენი შეკვეთა", total:"სულ", orderViaMessenger:"📨 შეკვეთის გაგზავნა Messenger-ით", footer:"კითხვები? დაგვიკავშირდით Facebook Messenger-ზე", addToCart:"კალათაში", sold:"გაყიდულია", emptyCart:"კალათა ცარიელია", sentTitle:"შეკვეთა გაიგზავნა!", sentDesc:"მალე დაგიდასტურებთ Messenger-ში.", backToShop:"გაგრძელება", namePlaceholder:"თქვენი სახელი", phonePlaceholder:"ტელეფონის ნომერი", nameRequired:"გთხოვთ შეიყვანოთ სახელი", orderMsg:"გამარჯობა! მე მინდა შევუკვეთო:\n\n{items}\n\nსულ: ₾{total}\n\nსახელი: {name}\nტელეფონი: {phone}\nშეკვეთის ID: {orderId}", cats:{wallets:"საფულეები და ჩანთები",perfume:"სუნამო და სილამაზე",accessories:"აქსესუარები",other:"სხვა"} }
};
const CATEGORIES = [{key:"wallets",emoji:"👛"},{key:"perfume",emoji:"🌸"},{key:"accessories",emoji:"🎀"},{key:"other",emoji:"🎁"}];

const _allLangs = [navigator.language, ...(navigator.languages || [])].filter(Boolean);
const _hasLang = prefix => _allLangs.some(l => l.startsWith(prefix));
let lang = _hasLang('ka') ? 'ge' : _hasLang('ru') ? 'ru' : 'en';
let cart = {}, products = [];

window.setLang = l => { lang=l; document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===l)); applyT(); renderCatalog(); updateBar(); };
const t = k => T[lang][k] || k;
function applyT() {
  document.querySelectorAll('[data-t]').forEach(el => { const v=T[lang][el.getAttribute('data-t')]; if(v!==undefined) el.textContent=v; });
  document.querySelectorAll('[data-t-placeholder]').forEach(el => { const v=T[lang][el.getAttribute('data-t-placeholder')]; if(v!==undefined) el.placeholder=v; });
}

onSnapshot(collection(db,"products"), snap => {
  products = snap.docs.map(d=>({firestoreId:d.id,...d.data()}));
  Object.keys(cart).forEach(id => { const p=products.find(x=>x.id===id); if(p&&p.sold) delete cart[id]; });
  applyT(); renderCatalog(); updateBar();
});

function renderCatalog() {
  const cat = document.getElementById('catalog');
  if (!products.length) { cat.innerHTML='<div class="loading-screen"><div class="spinner"></div><p>Загрузка...</p></div>'; return; }
  cat.innerHTML='';
  CATEGORIES.forEach(({key,emoji}) => {
    const items = products.filter(p=>p.cat===key);
    if (!items.length) return;
    const block = document.createElement('div'); block.className='category-block';
    block.innerHTML=`<div class="category-title"><span>${emoji}</span> ${t('cats')[key]}</div><div class="product-grid" id="grid-${key}"></div>`;
    cat.appendChild(block);
    const grid = block.querySelector(`#grid-${key}`);
    items.forEach((p,i) => {
      const card = document.createElement('div');
      card.className='product-card'+(p.sold?' is-sold':''); card.style.animationDelay=`${i*0.05}s`; card.id=`card-${p.id}`;
      const imgHtml = p.photoUrl ? `<img src="${p.photoUrl}" alt="" loading="lazy">` : (p.emoji||'🛍️');
      card.innerHTML=`<div class="product-img">${imgHtml}${p.sold?`<div class="sold-ribbon">${t('sold')}</div>`:''}</div>
        <div class="product-body">
          <div class="product-sku">${p.id}</div>
          <div class="product-name">${p.name?.[lang]||p.name?.ru||''}</div>
          <div class="product-desc">${p.desc?.[lang]||p.desc?.ru||''}</div>
          <div class="product-price">₾${p.price}</div>
          ${ctrl(p)}</div>`;
      grid.appendChild(card);
    });
  });
}

function ctrl(p) {
  if (p.sold) return `<button class="sold-btn">${t('sold')}</button>`;
  const qty=cart[p.id]||0;
  if (!qty) return `<button class="add-btn" onclick="addToCart('${p.id}')">${t('addToCart')}</button>`;
  return `<div class="qty-control"><button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button></div>`;
}

function updCard(id) { const p=products.find(x=>x.id===id),card=document.getElementById(`card-${id}`); if(!card||!p)return; card.querySelector('.product-body').innerHTML=`<div class="product-sku">${p.id}</div><div class="product-name">${p.name?.[lang]||p.name?.ru||''}</div><div class="product-desc">${p.desc?.[lang]||p.desc?.ru||''}</div><div class="product-price">₾${p.price}</div>${ctrl(p)}`; }

window.addToCart = id => { cart[id]=1; updCard(id); updateBar(); };
window.changeQty = (id,d) => { cart[id]=(cart[id]||0)+d; if(cart[id]<=0)delete cart[id]; updCard(id); updateBar(); };
window.removeFromCart = id => { delete cart[id]; updCard(id); updateBar(); renderPanel(); };

const totalItems = () => Object.values(cart).reduce((s,q)=>s+q,0);
const totalPrice = () => Object.entries(cart).reduce((s,[id,q])=>{ const p=products.find(x=>x.id===id); return s+(p?p.price*q:0); },0);
function updateBar() { document.getElementById('cartCount').textContent=totalItems(); document.getElementById('openCartBtn').disabled=totalItems()===0; }

window.openCart = () => { renderPanel(); document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartPanel').classList.add('open'); };
window.closeCart = () => { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartPanel').classList.remove('open'); };

function renderPanel() {
  const list=document.getElementById('cartItemsList'), entries=Object.entries(cart);
  if (!entries.length) { list.innerHTML=`<div class="empty-cart"><div class="big">🛒</div>${t('emptyCart')}</div>`; document.getElementById('cartTotalVal').textContent='₾0'; return; }
  list.innerHTML=entries.map(([id,qty])=>{ const p=products.find(x=>x.id===id); if(!p)return''; return `<div class="cart-item"><div class="cart-item-emoji">${p.emoji||'🛍️'}</div><div class="cart-item-info"><div class="cart-item-sku">${p.id}</div><div class="cart-item-name">${p.name?.[lang]||p.name?.ru||''}</div><div class="cart-item-price">₾${p.price} × ${qty} = ₾${p.price*qty}</div></div><button class="cart-item-remove" onclick="removeFromCart('${p.id}')">✕</button></div>`; }).join('');
  document.getElementById('cartTotalVal').textContent=`₾${totalPrice()}`;
}

window.sendOrder = async () => {
  const entries=Object.entries(cart); if(!entries.length)return;
  const nameEl=document.getElementById('orderName');
  const name=nameEl.value.trim();
  if(!name){ nameEl.classList.add('error'); nameEl.focus(); setTimeout(()=>nameEl.classList.remove('error'),1200); return; }
  const phone=document.getElementById('orderPhone').value.trim();
  const orderItems=entries.map(([id,qty])=>{ const p=products.find(x=>x.id===id); return {id,qty,name:p?.name?.[lang]||p?.name?.ru||id,price:p?.price||0}; });
  const orderId='ORD-'+Date.now();
  try { await addDoc(collection(db,"orders"),{orderId,status:'pending',createdAt:serverTimestamp(),items:orderItems,total:totalPrice(),lang,customerName:name,customerPhone:phone}); } catch(e){console.error(e);}
  const lines=orderItems.map(i=>`• [${i.id}] ${i.name} × ${i.qty} — ₾${i.price*i.qty}`).join('\n');
  const msg=T[lang].orderMsg.replace('{items}',lines).replace('{total}',totalPrice()).replace('{name}',name).replace('{phone}',phone||'—').replace('{orderId}',orderId);
  window.open(`${MESSENGER_URL}?text=${encodeURIComponent(msg)}`, '_blank');
  cart={}; nameEl.value=''; document.getElementById('orderPhone').value='';
  closeCart(); updateBar(); renderCatalog();
  document.getElementById('orderSent').classList.add('show');
};
window.dismissSent = () => document.getElementById('orderSent').classList.remove('show');
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === lang));
applyT();
</script>
</body>
</html>
