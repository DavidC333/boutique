<div class="lang-bar">

</div>

    </div>
  </div>
</div>
<div class="cat-bar">

</div>

<footer data-t="footer"></footer>
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">

    </div>
    <button class="messenger-btn" onclick="prepareLead()" data-t="orderViaMessenger"></button>
  </div>
</div>
<div class="order-sent" id="orderSent">
  <div class="big-check">✅</div>
  <h2 data-t="sentTitle"></h2>
  <p data-t="sentDesc"></p>
  <button onclick="dismissSent()" data-t="backToShop"></button>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitleEl"></div>
    <div id="confirmItems"></div>
    <p class="confirm-hint" id="confirmHintEl"></p>

</div>

  ge: { storeName:"გაყიდვა", storeSub:"სპეციალური გაყიდვა · ყველაფერი უნდა გაიყიდოს", cartLabel:"პროდუქტი კალათაში", viewCart:"განაცხადის ნახვა", yourOrder:"თქვენი განაცხადი", total:"სულ", orderViaMessenger:"📨 გაგრძელება Messenger-ში", footer:"კითხვები? დაგვიკავშირდით Facebook Messenger-ზე", addToCart:"კალათაში", sold:"გაყიდულია", emptyCart:"კალათა ცარიელია", sentTitle:"განაცხადი გაიგზავნა!", sentDesc:"თქვენი განაცხადი შენახულია. გააგრძელეთ Messenger-ში ხელმისაწვდომობის დასადასტურებლად.", backToShop:"გაგრძელება", searchPlaceholder:"ძებნა...", notFound:"ვერაფერი მოიძებნა", badgeNew:"ახალი", badgeSale:"ფასდაკლება", sortPriceAsc:"ფასი ↑", sortPriceDesc:"ფასი ↓", sortNew:"ახალი პირველი", namePlaceholder:"თქვენი სახელი", phonePlaceholder:"ტელეფონის ნომერი", nameRequired:"გთხოვთ შეიყვანოთ სახელი", orderMsg:"გამარჯობა! განაცხადი:\n\n{items}\n\nსულ: ₾{total}\n\nსახელი: {name}\nტელეფონი: {phone}\nID: {orderId}", linkCopied:"ბმული დაკოპირდა!", share:"გაზიარება", lowStock:"{n} ცალი დარჩა", confirmTitle:"თქვენი განაცხადი", confirmHint:"განაცხადი შეინახება Messenger-ის გახსნისას.", backBtn:"← უკან", filterAll:"ყველა", filterWallets:"საფულეები", filterPerfume:"სუნამო", filterAccessories:"აქსესუარები", filterOther:"სხვა", cats:{wallets:"საფულეები და ჩანთები",perfume:"სუნამო და სილამაზე",accessories:"აქსესუარები",other:"სხვა"} }
};
const CATEGORIES = [{key:"wallets",emoji:"👛"},{key:"perfume",emoji:"🌸"},{key:"accessories",emoji:"🎀"},{key:"other",emoji:"🎁"}];

const _allLangs = [navigator.language, ...(navigator.languages || [])].filter(Boolean);
const _hasLang = prefix => _allLangs.some(l => l.startsWith(prefix));
let lang = _hasLang('ka') ? 'ge' : _hasLang('ru') ? 'ru' : 'en';
let cart = {}, products = [], searchQuery = '', sortMode = '', catFilter = '';
let _pendingLead = null;
const stockOf = p => p.stock !== undefined ? p.stock : (p.sold ? 0 : 99);
function getPhotos(p) { return p.photos?.length ? p.photos : (p.photoUrl ? [p.photoUrl] : []); }

window.setLang = l => { lang=l; document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===l)); applyT(); renderCatBar(); renderCatalog(); updateBar(); };
const t = k => T[lang][k] || k;
function applyT() {
  document.querySelectorAll('[data-t]').forEach(el => { const v=T[lang][el.getAttribute('data-t')]; if(v!==undefined) el.textContent=v; });
  document.querySelectorAll('[data-t-placeholder]').forEach(el => { const v=T[lang][el.getAttribute('data-t-placeholder')]; if(v!==undefined) el.placeholder=v; });
}

onSnapshot(collection(db,"products"), snap => {
  products = snap.docs.map(d=>({firestoreId:d.id,...d.data()}));
  Object.keys(cart).forEach(id => { const p=products.find(x=>x.id===id); if(p&&stockOf(p)<=0) delete cart[id]; });
  applyT(); renderCatBar(); renderCatalog(); updateBar();
});

window.onSearch = q => { searchQuery=q.trim().toLowerCase(); document.getElementById('searchClear').style.display=q?'block':'none'; renderCatalog(); };
window.clearSearch = () => { searchQuery=''; document.getElementById('searchInput').value=''; document.getElementById('searchClear').style.display='none'; renderCatalog(); };
window.setSort = mode => {
  sortMode = sortMode===mode ? '' : mode;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active', b.id==='sort-'+sortMode));
  renderCatalog();
};
window.setCatFilter = key => { catFilter = catFilter===key ? '' : key; renderCatBar(); renderCatalog(); };
function renderCatBar() {
  const bar = document.getElementById('catBar');
  bar.textContent = '';
  const filters = [{key:'',tKey:'filterAll'},{key:'wallets',tKey:'filterWallets'},{key:'perfume',tKey:'filterPerfume'},{key:'accessories',tKey:'filterAccessories'},{key:'other',tKey:'filterOther'}];
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (catFilter===f.key?' active':'');
    btn.textContent = t(f.tKey);
    btn.addEventListener('click', () => setCatFilter(f.key));
    bar.appendChild(btn);
  });
}
function applySorting(arr) {
  if (sortMode==='price-asc') return [...arr].sort((a,b)=>a.price-b.price);
  if (sortMode==='price-desc') return [...arr].sort((a,b)=>b.price-a.price);
  if (sortMode==='new') return [...arr].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  return arr;
}

// ── DOM BUILDERS ─────────────────────────────────────
function buildProductImg(p) {
  const imgDiv = document.createElement('div');
  imgDiv.className = 'product-img';
  const st = stockOf(p);
  const photos = getPhotos(p);
  if (photos.length > 1) {
    const galWrap = document.createElement('div');
    galWrap.className = 'gal-wrap';
    galWrap.id = 'gal-' + p.id;
    galWrap.dataset.photos = encodeURIComponent(JSON.stringify(photos));
    galWrap.dataset.idx = '0';
    const img = document.createElement('img');
    img.src = photos[0]; img.alt = ''; img.loading = 'lazy'; img.id = 'gal-img-' + p.id;
    const prev = document.createElement('button');
    prev.className = 'gal-arrow gal-prev'; prev.textContent = '‹';
    prev.addEventListener('click', e => { e.stopPropagation(); galNav(p.id, -1); });
    const next = document.createElement('button');
    next.className = 'gal-arrow gal-next'; next.textContent = '›';
    next.addEventListener('click', e => { e.stopPropagation(); galNav(p.id, 1); });
    const dots = document.createElement('div'); dots.className = 'gal-dots';
    photos.forEach((_, di) => {
      const dot = document.createElement('span');
      dot.className = 'gal-dot' + (di===0?' active':'');
      dot.id = 'gal-dot-' + p.id + '-' + di;
      dots.appendChild(dot);
    });
    galWrap.append(img, prev, next, dots);
    imgDiv.appendChild(galWrap);
  } else if (photos.length === 1) {
    const img = document.createElement('img');
    img.src = photos[0]; img.alt = ''; img.loading = 'lazy';
    imgDiv.appendChild(img);
  } else {
    imgDiv.textContent = p.emoji || '🛍️';
  }
  if (p.isNew || p.isSale) {
    const badgesDiv = document.createElement('div'); badgesDiv.className = 'product-badges';
    if (p.isNew) { const b=document.createElement('span'); b.className='product-badge badge-new'; b.textContent=t('badgeNew'); badgesDiv.appendChild(b); }
    if (p.isSale) { const b=document.createElement('span'); b.className='product-badge badge-sale'; b.textContent=t('badgeSale'); badgesDiv.appendChild(b); }
    imgDiv.appendChild(badgesDiv);
  }
  if (st <= 0) { const r=document.createElement('div'); r.className='sold-ribbon'; r.textContent=t('sold'); imgDiv.appendChild(r); }
  return imgDiv;
}

function buildCtrl(p) {
  const st = stockOf(p);
  if (st <= 0) { const btn=document.createElement('button'); btn.className='sold-btn'; btn.textContent=t('sold'); return btn; }
  const qty = cart[p.id]||0;
  const maxQty = p.stock !== undefined ? p.stock : 99;
  if (!qty) {
    const btn=document.createElement('button'); btn.className='add-btn'; btn.textContent=t('addToCart');
    btn.addEventListener('click', () => addToCart(p.id)); return btn;
  }
  const div=document.createElement('div'); div.className='qty-control';
  const minus=document.createElement('button'); minus.className='qty-btn'; minus.textContent='−';
  minus.addEventListener('click', () => changeQty(p.id,-1));
  const num=document.createElement('span'); num.className='qty-num'; num.textContent=qty;
  const plus=document.createElement('button'); plus.className='qty-btn'; plus.textContent='+';
  if (qty>=maxQty) { plus.disabled=true; plus.style.opacity='0.35'; plus.style.cursor='default'; }
  plus.addEventListener('click', () => changeQty(p.id,1));
  div.append(minus,num,plus); return div;
}

function buildProductBody(p) {
  const st = stockOf(p);
  const body=document.createElement('div'); body.className='product-body';
  const sku=document.createElement('div'); sku.className='product-sku'; sku.textContent=p.id;
  const name=document.createElement('div'); name.className='product-name'; name.textContent=p.name?.[lang]||p.name?.ru||'';
  const desc=document.createElement('div'); desc.className='product-desc'; desc.textContent=p.desc?.[lang]||p.desc?.ru||'';
  const priceDiv=document.createElement('div'); priceDiv.className='product-price';
  if (p.oldPrice) { const s=document.createElement('span'); s.className='price-old'; s.textContent='₾'+p.oldPrice; priceDiv.appendChild(s); }
  priceDiv.append('₾'+p.price);
  body.append(sku,name,desc,priceDiv);
  if (st>0&&st<=5) { const w=document.createElement('div'); w.className='stock-warn'; w.textContent=t('lowStock').replace('{n}',st); body.appendChild(w); }
  const shareBtn=document.createElement('button'); shareBtn.className='share-btn';
  shareBtn.textContent='🔗 '+t('share');
  shareBtn.addEventListener('click', e=>{e.stopPropagation(); shareProduct(p.id);});
  body.append(shareBtn, buildCtrl(p));
  return body;
}

function renderCatalog() {
  const cat = document.getElementById('catalog');
  if (!products.length) { cat.innerHTML='<div class="loading-screen"><div class="spinner"></div><p>Загрузка...</p></div>'; return; }
  const q = searchQuery;
  const catFiltered = catFilter ? products.filter(p=>p.cat===catFilter) : products;
  const filtered = q ? catFiltered.filter(p=>(p.name?.[lang]||p.name?.ru||'').toLowerCase().includes(q)) : catFiltered;
  const visible = applySorting(filtered);
  if (!visible.length) { cat.innerHTML=`<div class="loading-screen"><p style="font-size:15px">${t('notFound')}</p></div>`; return; }
  cat.innerHTML='';
  CATEGORIES.forEach(({key,emoji}) => {
    const items = visible.filter(p=>p.cat===key);
    if (!items.length) return;
    const block = document.createElement('div'); block.className='category-block';
    block.innerHTML=`<div class="category-title"><span>${emoji}</span> ${t('cats')[key]}</div><div class="product-grid" id="grid-${key}"></div>`;
    cat.appendChild(block);
    const grid = block.querySelector(`#grid-${key}`);
    items.forEach((p,i) => {
      const card = document.createElement('div');
      const st = stockOf(p);
      card.className='product-card'+(st<=0?' is-sold':'');
      card.style.animationDelay=`${i*0.05}s`;
      card.id='card-'+p.id;
      card.appendChild(buildProductImg(p));
      card.appendChild(buildProductBody(p));
      grid.appendChild(card);
    });
  });
}

function updCard(id) {
  const p=products.find(x=>x.id===id), card=document.getElementById('card-'+id);
  if (!card||!p) return;
  card.className='product-card'+(stockOf(p)<=0?' is-sold':'');
  const oldBody=card.querySelector('.product-body');
  if (oldBody) card.replaceChild(buildProductBody(p), oldBody);
}

window.addToCart = id => { cart[id]=1; updCard(id); updateBar(); };
window.changeQty = (id,d) => { cart[id]=(cart[id]||0)+d; if(cart[id]<=0)delete cart[id]; updCard(id); updateBar(); };
window.removeFromCart = id => { delete cart[id]; updCard(id); updateBar(); renderPanel(); };

const totalItems = () => Object.values(cart).reduce((s,q)=>s+q,0);
const totalPrice = () => Object.entries(cart).reduce((s,[id,q])=>{ const p=products.find(x=>x.id===id); return s+(p?p.price*q:0); },0);
function updateBar() { document.getElementById('cartCount').textContent=totalItems(); document.getElementById('openCartBtn').disabled=totalItems()===0; }

window.openCart = () => { renderPanel(); document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartPanel').classList.add('open'); };
window.closeCart = () => { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartPanel').classList.remove('open'); };

function renderPanel() {
  const list=document.getElementById('cartItemsList');
  const entries=Object.entries(cart);
  list.textContent='';
  if (!entries.length) {
    const empty=document.createElement('div'); empty.className='empty-cart';
    const icon=document.createElement('div'); icon.className='big'; icon.textContent='🛒';
    empty.append(icon, t('emptyCart'));
    list.appendChild(empty);
    document.getElementById('cartTotalVal').textContent='₾0'; return;
  }
  entries.forEach(([id,qty]) => {
    const p=products.find(x=>x.id===id); if(!p) return;
    const item=document.createElement('div'); item.className='cart-item';
    const emojiDiv=document.createElement('div'); emojiDiv.className='cart-item-emoji'; emojiDiv.textContent=p.emoji||'🛍️';
    const info=document.createElement('div'); info.className='cart-item-info';
    const sku=document.createElement('div'); sku.className='cart-item-sku'; sku.textContent=p.id;
    const nm=document.createElement('div'); nm.className='cart-item-name'; nm.textContent=p.name?.[lang]||p.name?.ru||'';
    const pr=document.createElement('div'); pr.className='cart-item-price'; pr.textContent=`₾${p.price} × ${qty} = ₾${p.price*qty}`;
    info.append(sku,nm,pr);
    const rm=document.createElement('button'); rm.className='cart-item-remove'; rm.textContent='✕';
    rm.addEventListener('click', ()=>removeFromCart(p.id));
    item.append(emojiDiv,info,rm);
    list.appendChild(item);
  });
  document.getElementById('cartTotalVal').textContent=`₾${totalPrice()}`;
}

// Step 1: validate → show confirmation overlay (nothing saved to Firestore yet)
window.prepareLead = () => {
  const entries = Object.entries(cart); if (!entries.length) return;
  const nameEl = document.getElementById('orderName');
  const name = nameEl.value.trim();
  if (!name) { nameEl.classList.add('error'); nameEl.focus(); setTimeout(()=>nameEl.classList.remove('error'),1200); return; }
  const phone = document.getElementById('orderPhone').value.trim();
  const items = entries.map(([id,qty]) => { const p=products.find(x=>x.id===id); return {id,qty,name:p?.name?.[lang]||p?.name?.ru||id,price:p?.price||0}; });
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  _pendingLead = {name,phone,items,total};
  // Populate overlay
  document.getElementById('confirmTitleEl').textContent = t('confirmTitle');
  document.getElementById('confirmHintEl').textContent = t('confirmHint');
  document.getElementById('confirmMessengerBtn').textContent = T[lang].orderViaMessenger;
  document.getElementById('confirmBackBtn').textContent = t('backBtn');
  const ci=document.getElementById('confirmItems');
  ci.textContent='';
  items.forEach(i=>{
    const row=document.createElement('div'); row.className='confirm-item-row';
    const n=document.createElement('span'); n.className='confirm-item-name'; n.textContent=i.name+' ×'+i.qty;
    const pr=document.createElement('span'); pr.className='confirm-item-price'; pr.textContent='₾'+(i.price*i.qty);
    row.append(n,pr); ci.appendChild(row);
  });
  const totalRow=document.createElement('div'); totalRow.className='confirm-total';
  const tl=document.createElement('span'); tl.textContent=t('total');
  const tv=document.createElement('span'); tv.textContent='₾'+total;
  totalRow.append(tl,tv); ci.appendChild(totalRow);
  document.getElementById('confirmOverlay').classList.add('open');
};

// Step 2: user clicked big Messenger button → now save and open
window.sendLead = async () => {
  if (!_pendingLead) return;
  closeConfirm();
  const {name,phone,items,total} = _pendingLead;
  _pendingLead = null;
  const orderId = 'REQ-'+Date.now();
  try { await addDoc(collection(db,"orders"),{orderId,status:'messenger_pending',createdAt:serverTimestamp(),items,total,lang,customerName:name,customerPhone:phone}); } catch(e){console.error(e);}
  const lines = items.map(i=>`• [${i.id}] ${i.name} × ${i.qty} — ₾${i.price*i.qty}`).join('\n');
  if (NOTIFY_WEBHOOK && !NOTIFY_WEBHOOK.includes('YOUR_WEBHOOK')) {
    fetch(NOTIFY_WEBHOOK, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({orderId, items, total, customerName:name, customerPhone:phone||'', lang})
    }).catch(()=>{});
  }
  const msg = T[lang].orderMsg.replace('{items}',lines).replace('{total}',total).replace('{name}',name).replace('{phone}',phone||'—').replace('{orderId}',orderId);
  window.open(`${MESSENGER_URL}?text=${encodeURIComponent(msg)}`, '_blank');
  cart={}; document.getElementById('orderName').value=''; document.getElementById('orderPhone').value='';
  closeCart(); updateBar(); renderCatalog();
  document.getElementById('orderSent').classList.add('show');
};

window.closeConfirm = () => { document.getElementById('confirmOverlay').classList.remove('open'); };
window.dismissSent = () => document.getElementById('orderSent').classList.remove('show');
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === lang));
applyT();
renderCatBar();

// ── GALLERY ──────────────────────────────────────────
window.galNav = (id, dir) => {
  const wrap = document.getElementById('gal-'+id); if (!wrap) return;
  const photos = JSON.parse(decodeURIComponent(wrap.dataset.photos));
  const idx = (parseInt(wrap.dataset.idx)+dir+photos.length)%photos.length;
  wrap.dataset.idx = idx;
  document.getElementById('gal-img-'+id).src = photos[idx];
  wrap.querySelectorAll('.gal-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
};

// ── SHARE ────────────────────────────────────────────
window.shareProduct = id => {
  const url = location.origin + location.pathname + '?item=' + encodeURIComponent(id);
  navigator.clipboard.writeText(url).then(() => showToast(t('linkCopied')));
};

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ── DEEP LINK ?item= ─────────────────────────────────
const itemParam = new URLSearchParams(location.search).get('item');
if (itemParam) {
  const tryScroll = () => {
    const card = document.getElementById('card-' + itemParam);
    if (!card) return false;
    card.scrollIntoView({ behavior:'smooth', block:'center' });
    card.classList.add('highlight');
    setTimeout(() => card.classList.remove('highlight'), 2000);
    return true;
  };
  if (!tryScroll()) {
    const obs = new MutationObserver(() => { if (tryScroll()) obs.disconnect(); });
    obs.observe(document.getElementById('catalog'), { childList:true, subtree:true });
    setTimeout(() => obs.disconnect(), 5000);
  }
}
</script>
