<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель · Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f3ee; --dark:#1a1410; --gold:#b8935a; --gold-light:#d4aa72; --muted:#8a7968; --border:#e2d9ce; --card:#fff; --green:#2e7d4f; --green-light:#e8f5ee; --red:#c44b3a; --red-light:#fdf0ee; --yellow:#c48a1a; --yellow-light:#fdf6e3; --gray:#888; --gray-light:#f0f0f0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--dark); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; }
  header { background:var(--dark); padding:20px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .h-title { font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:300; color:#f7f3ee; letter-spacing:0.08em; }
  .h-sub { font-size:11px; color:var(--gold); letter-spacing:0.2em; text-transform:uppercase; margin-top:3px; }
  .tabs { background:var(--card); border-bottom:1px solid var(--border); display:flex; padding:0 32px; overflow-x:auto; }
  .tab { padding:14px 20px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; white-space:nowrap; }
  .tab.active { color:var(--dark); border-bottom-color:var(--gold); font-weight:500; }
  .tab-badge { display:inline-flex; align-items:center; justify-content:center; background:var(--red); color:#fff; font-size:10px; border-radius:50%; width:17px; height:17px; margin-left:6px; }
  main { max-width:960px; margin:0 auto; padding:32px 24px 80px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:32px; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:4px; padding:16px 20px; }
  .stat-num { font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:400; }
  .stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:4px; }
  .section { display:none; }
  .section.active { display:block; }
  .order-card { background:var(--card); border:1px solid var(--border); border-radius:4px; margin-bottom:12px; overflow:hidden; }
  .order-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; gap:12px; flex-wrap:wrap; }
  .order-id { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0.05em; }
  .order-ts { font-size:11px; color:var(--muted); }
  .order-total { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--gold); }
  .status-badge { font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; padding:3px 10px; border-radius:20px; }
  .status-pending, .status-messenger_pending { background:var(--yellow-light); color:var(--yellow); }
  .status-confirmed { background:var(--green-light); color:var(--green); }
  .status-rejected { background:var(--red-light); color:var(--red); }
  .status-completed { background:#e8eaf6; color:#3949ab; }
  .btn-complete { background:#3949ab; color:#fff; }
  .orders-filter { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .filter-btn { background:none; border:1px solid var(--border); color:var(--muted); font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:0.05em; padding:5px 12px; border-radius:20px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
  .filter-btn:hover { border-color:var(--gold-light); color:var(--dark); }
  .filter-btn.active { background:var(--dark); border-color:var(--dark); color:#fff; }
  .order-items { padding:0 18px 14px; }
  .order-item-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--border); font-size:13px; gap:8px; }
  .order-item-sku { font-size:10px; color:var(--muted); letter-spacing:0.1em; background:#f7f3ee; padding:2px 6px; border-radius:2px; white-space:nowrap; }
  .order-item-name { flex:1; }
  .order-item-price { color:var(--gold); white-space:nowrap; }
  .order-actions { padding:12px 18px; background:#fafaf8; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap; }
  .btn { padding:8px 18px; border:none; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; letter-spacing:0.05em; cursor:pointer; border-radius:2px; transition:opacity 0.15s; }
  .btn-accept { background:var(--green); color:#fff; }
  .btn-reject { background:var(--red); color:#fff; }
  .btn-undo { background:var(--gray-light); color:var(--gray); }
  .btn:hover { opacity:0.82; }
  .empty-state { text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
  .empty-state .icon { font-size:40px; margin-bottom:12px; }

  /* ADD PRODUCT FORM */
  .add-product-section { background:var(--card); border:1px solid var(--border); border-radius:4px; padding:24px; margin-bottom:24px; }
  .add-product-section h3 { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:400; margin-bottom:16px; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .form-field { display:flex; flex-direction:column; gap:4px; }
  .form-field label { font-size:11px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
  .form-field input, .form-field select { padding:8px 10px; border:1px solid var(--border); border-radius:2px; font-family:'DM Sans',sans-serif; font-size:13px; background:var(--bg); color:var(--dark); }
  .form-field input:focus, .form-field select:focus { outline:none; border-color:var(--gold); }
  .btn-add-product { margin-top:16px; padding:10px 24px; background:var(--dark); color:var(--card); border:none; font-family:'DM Sans',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border-radius:2px; }
  .btn-add-product:hover { background:var(--gold); }

  /* INVENTORY */
  .inv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .inv-card { background:var(--card); border:1px solid var(--border); border-radius:4px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .inv-emoji { font-size:28px; flex-shrink:0; }
  .inv-info { flex:1; min-width:0; }
  .inv-sku { font-size:10px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
  .inv-name { font-size:13px; font-weight:400; line-height:1.3; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .inv-price { font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--gold); margin-top:2px; }
  .toggle-btn { flex-shrink:0; width:36px; height:20px; border-radius:10px; border:none; cursor:pointer; position:relative; transition:background 0.2s; }
  .toggle-btn.on { background:var(--green); }
  .toggle-btn.off { background:#ccc; }
  .toggle-btn::after { content:''; position:absolute; top:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left 0.2s; }
  .toggle-btn.on::after { left:18px; }
  .toggle-btn.off::after { left:2px; }
  .inv-card.is-sold { opacity:0.55; }
  .inv-card.is-sold .inv-name { text-decoration:line-through; }
  .inv-edit { background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; flex-shrink:0; transition:color 0.15s; padding:0 2px; }
  .inv-edit:hover { color:var(--gold); }
  .inv-delete { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; margin-left:2px; flex-shrink:0; transition:color 0.15s; }
  .inv-delete:hover { color:var(--red); }

  /* EDIT MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:500; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--card); border-radius:6px; padding:28px 32px; width:min(580px,100%); max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
  .modal-title { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:400; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--border); }
  .modal-actions { display:flex; gap:10px; margin-top:22px; justify-content:flex-end; }
  .btn-modal-save { padding:10px 26px; background:var(--dark); color:var(--card); border:none; font-family:'DM Sans',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:background 0.2s; }
  .btn-modal-save:hover { background:var(--gold); }
  .btn-modal-cancel { padding:10px 20px; background:none; border:1px solid var(--border); color:var(--muted); font-family:'DM Sans',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:all 0.2s; }
  .btn-modal-cancel:hover { border-color:var(--dark); color:var(--dark); }
  .inv-flags { display:flex; gap:3px; flex-shrink:0; font-size:15px; line-height:1; }
  .form-field.checkbox { flex-direction:row; align-items:center; gap:8px; padding-top:22px; }
  .form-field.checkbox label { font-size:12px; color:var(--dark); text-transform:none; letter-spacing:0; cursor:pointer; font-weight:400; }
  .form-field.checkbox input[type=checkbox] { width:15px; height:15px; accent-color:var(--gold); cursor:pointer; flex-shrink:0; }

  .loading-screen { text-align:center; padding:40px; color:var(--muted); }
  .spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  @media(max-width:600px) { header{padding:16px;} .tabs{padding:0 16px;} main{padding:20px 14px 60px;} }

  /* LOGIN SCREEN */
  .login-overlay { position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; }
  .login-box { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:40px 36px; width:min(360px,90vw); text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.08); }
  .login-logo { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; color:var(--dark); letter-spacing:0.1em; }
  .login-sub { font-size:11px; color:var(--gold); letter-spacing:0.2em; text-transform:uppercase; margin-top:6px; margin-bottom:28px; }
  .login-box input[type=email], .login-box input[type=password] { width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:3px; font-family:'DM Sans',sans-serif; font-size:14px; background:var(--bg); color:var(--dark); outline:none; transition:border-color 0.2s; margin-bottom:8px; }
  .login-box input[type=email]:focus, .login-box input[type=password]:focus { border-color:var(--gold); }
  .login-box input.error { border-color:var(--red); }
  .btn-logout { background:none; border:1px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.65); font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; padding:7px 16px; cursor:pointer; border-radius:2px; transition:all 0.2s; }
  .btn-logout:hover { background:var(--gold); border-color:var(--gold); color:#fff; }
  .login-error { font-size:12px; color:var(--red); margin-top:8px; min-height:18px; }
  .login-btn { width:100%; margin-top:16px; padding:12px; background:var(--dark); color:var(--card); border:none; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; border-radius:3px; transition:background 0.2s; }
  .login-btn:hover { background:var(--gold); }
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">Boutique</div>
    <div class="login-sub">Admin · Панель управления</div>
    <input type="email" id="loginEmail" placeholder="Email" onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="loginPassword" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" onclick="doLogin()">Войти</button>
  </div>
</div>
<header>
  <div>
    <div class="h-title">Панель управления</div>
    <div class="h-sub">Boutique Sale · Admin</div>
  </div>
  <button class="btn-logout" id="logoutBtn" onclick="doLogout()" style="display:none">Выйти</button>
</header>
<div class="tabs">
  <div class="tab active" onclick="switchTab('orders')" id="tab-orders">Заказы <span class="tab-badge" id="pendingBadge" style="display:none">0</span></div>
  <div class="tab" onclick="switchTab('inventory')" id="tab-inventory">Товары</div>
</div>
<main>
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="s-pending">—</div><div class="stat-label">В Messenger</div></div>
    <div class="stat-card"><div class="stat-num" id="s-confirmed">—</div><div class="stat-label">Принято</div></div>
    <div class="stat-card"><div class="stat-num" id="s-sold">—</div><div class="stat-label">Продано</div></div>
    <div class="stat-card"><div class="stat-num" id="s-available">—</div><div class="stat-label">В наличии</div></div>
  </div>
  <div class="section active" id="section-orders">
    <div class="loading-screen"><div class="spinner"></div><p>Загрузка...</p></div>
  </div>
  <div class="section" id="section-inventory">
    <div class="add-product-section">
      <h3>Добавить товар</h3>
      <div class="form-grid">
        <div class="form-field"><label>Артикул</label><input id="f-id" placeholder="W-06"></div>
        <div class="form-field"><label>Категория</label>
          <select id="f-cat">
            <option value="wallets">Кошельки и сумки</option>
            <option value="perfume">Духи и красота</option>
            <option value="accessories">Аксессуары</option>
            <option value="other">Другое</option>
          </select>
        </div>
        <div class="form-field"><label>Эмодзи</label><input id="f-emoji" placeholder="👛" maxlength="2"></div>
        <div class="form-field"><label>Цена (₾)</label><input id="f-price" type="number" placeholder="35"></div>
        <div class="form-field"><label>Название (RU)</label><input id="f-name-ru" placeholder="Кошелёк кожаный"></div>
        <div class="form-field"><label>Название (EN)</label><input id="f-name-en" placeholder="Leather wallet"></div>
        <div class="form-field"><label>Название (GE)</label><input id="f-name-ge" placeholder="ტყავის საფულე"></div>
        <div class="form-field"><label>Описание (RU)</label><input id="f-desc-ru" placeholder="Краткое описание"></div>
        <div class="form-field checkbox"><input type="checkbox" id="f-isNew"><label for="f-isNew">🆕 Новинка</label></div>
        <div class="form-field checkbox"><input type="checkbox" id="f-isSale"><label for="f-isSale">🏷️ Скидка</label></div>
      </div>
      <button class="btn-add-product" onclick="addProduct()">+ Добавить товар</button>
    </div>
    <div class="inv-grid" id="inventoryGrid"><div class="loading-screen"><div class="spinner"></div></div></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsr51JFbm2HxwhorkUHnfVWOXRr5r4iy0",
  authDomain: "boutique-sale-2b5db.firebaseapp.com",
  projectId: "boutique-sale-2b5db",
  storageBucket: "boutique-sale-2b5db.firebasestorage.app",
  messagingSenderId: "227697473974",
  appId: "1:227697473974:web:56c7167a2e81648d05a917"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let orders = [], products = [];
let unsubOrders = null, unsubProducts = null;
let statusFilter = '';

const loginOverlay = document.getElementById('loginOverlay');
const logoutBtn = document.getElementById('logoutBtn');

// ── AUTH ──────────────────────────────────────────────
window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    errEl.textContent = 'Неверный email или пароль';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPassword').classList.add('error');
    setTimeout(() => document.getElementById('loginPassword').classList.remove('error'), 1200);
  }
};

window.doLogout = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user) {
    loginOverlay.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
    startListeners();
  } else {
    loginOverlay.style.display = 'flex';
    logoutBtn.style.display = 'none';
    stopListeners();
  }
});

function startListeners() {
  if (unsubOrders || unsubProducts) return;
  unsubOrders = onSnapshot(collection(db,"orders"), snap => {
    orders = snap.docs.map(d=>({_id:d.id,...d.data()}));
    renderOrders();
    renderStats();
  });
  unsubProducts = onSnapshot(collection(db,"products"), snap => {
    products = snap.docs.map(d=>({_id:d.id,...d.data()}));
    renderInventory();
    renderStats();
  });
}

function stopListeners() {
  if (unsubOrders) { unsubOrders(); unsubOrders = null; }
  if (unsubProducts) { unsubProducts(); unsubProducts = null; }
  orders = []; products = [];
}

// ── TABS ──────────────────────────────────────────────
window.switchTab = name => {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('section-'+name).classList.add('active');
};

// ── ORDERS ────────────────────────────────────────────
const MESSENGER_URL = "https://www.messenger.com/e2ee/t/1192818532433919";
const CONFIRM_MSG = {
  ru: (name) => `Здравствуйте, ${name}! Ваш заказ принят ✅\nКак только будет готов к выдаче — напишем вам.\nАдрес: г. Батуми, Шериф Химшиашвили 27`,
  en: (name) => `Hello, ${name}! Your order is confirmed ✅\nWe'll contact you when it's ready for pickup.\nAddress: 27 Sherif Khimshiashvili St, Batumi`,
  ge: (name) => `გამარჯობა, ${name}! თქვენი შეკვეთა მიღებულია ✅\nროდესაც მზად იქნება — დაგიკავშირდებით.\nმისამართი: ბათუმი, შერიფ ხიმშიაშვილი 27`,
};

window.confirmOrder = async (firestoreId, items, orderLang, customerName) => {
  await updateDoc(doc(db,"orders",firestoreId),{status:'confirmed'});
  for (const item of items) {
    const p = products.find(x=>x.id===item.id);
    if (p) await updateDoc(doc(db,"products",p._id),{sold:true});
  }
  const lang = orderLang && CONFIRM_MSG[orderLang] ? orderLang : 'ge';
  const name = customerName || '—';
  const msg = CONFIRM_MSG[lang](name);
  window.open(`${MESSENGER_URL}?text=${encodeURIComponent(msg)}`, '_blank');
};
window.rejectOrder = async firestoreId => { await updateDoc(doc(db,"orders",firestoreId),{status:'rejected'}); };
window.completeOrder = async firestoreId => { await updateDoc(doc(db,"orders",firestoreId),{status:'completed'}); };
window.setStatusFilter = f => { statusFilter=f; renderOrders(); };
window.undoOrder = async (firestoreId, status, items) => {
  if (status==='confirmed') {
    for (const item of items) {
      const p = products.find(x=>x.id===item.id);
      if (p) await updateDoc(doc(db,"products",p._id),{sold:false});
    }
    await updateDoc(doc(db,"orders",firestoreId),{status:'messenger_pending'});
  } else if (status==='completed') {
    await updateDoc(doc(db,"orders",firestoreId),{status:'confirmed'});
  } else {
    await updateDoc(doc(db,"orders",firestoreId),{status:'messenger_pending'});
  }
};

function fmtTime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}

function renderOrders() {
  const el = document.getElementById('section-orders');
  const labels = {messenger_pending:'📨 Messenger',pending:'📨 Messenger',confirmed:'Принято',completed:'Выполнено',rejected:'Отклонено'};
  const statusOrder = {messenger_pending:0,pending:0,confirmed:1,completed:2,rejected:3};
  const filterBar = `<div class="orders-filter">
    <button class="filter-btn${statusFilter===''?' active':''}" onclick="setStatusFilter('')">Все (${orders.length})</button>
    <button class="filter-btn${statusFilter==='messenger_pending'?' active':''}" onclick="setStatusFilter('messenger_pending')">📨 Messenger (${orders.filter(o=>o.status==='messenger_pending'||o.status==='pending').length})</button>
    <button class="filter-btn${statusFilter==='confirmed'?' active':''}" onclick="setStatusFilter('confirmed')">✅ Принято (${orders.filter(o=>o.status==='confirmed').length})</button>
    <button class="filter-btn${statusFilter==='completed'?' active':''}" onclick="setStatusFilter('completed')">✔ Выполнено (${orders.filter(o=>o.status==='completed').length})</button>
    <button class="filter-btn${statusFilter==='rejected'?' active':''}" onclick="setStatusFilter('rejected')">❌ Отклонено (${orders.filter(o=>o.status==='rejected').length})</button>
  </div>`;
  const displayed = statusFilter
    ? orders.filter(o => statusFilter==='messenger_pending' ? (o.status==='messenger_pending'||o.status==='pending') : o.status===statusFilter)
    : orders;
  if (!displayed.length) { el.innerHTML=filterBar+'<div class="empty-state"><div class="icon">📭</div>Заявок нет</div>'; return; }
  const sorted = [...displayed].sort((a,b)=>{
    const sa=statusOrder[a.status]??4, sb=statusOrder[b.status]??4;
    if (sa!==sb) return sa-sb;
    return (b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0);
  });
  el.innerHTML = filterBar + sorted.map(o => {
    const itemsHtml = (o.items||[]).map(i=>`<div class="order-item-row"><span class="order-item-sku">${i.id}</span><span class="order-item-name">${i.name}</span><span style="color:var(--muted);font-size:12px">×${i.qty}</span><span class="order-item-price">₾${i.price*i.qty}</span></div>`).join('');
    const itemsJson = encodeURIComponent(JSON.stringify(o.items||[]));
    const safeName = (o.customerName||'').replace(/'/g,"\\'");
    let actions;
    if (o.status==='messenger_pending'||o.status==='pending') {
      actions = `<button class="btn btn-accept" onclick="confirmOrder('${o._id}',JSON.parse(decodeURIComponent('${itemsJson}')),'${o.lang||''}','${safeName}')">✅ Принять</button><button class="btn btn-reject" onclick="rejectOrder('${o._id}')">❌ Отклонить</button>`;
    } else if (o.status==='confirmed') {
      actions = `<button class="btn btn-complete" onclick="completeOrder('${o._id}')">✔ Выполнен</button><button class="btn btn-undo" onclick="undoOrder('${o._id}','${o.status}',JSON.parse(decodeURIComponent('${itemsJson}')))">↩ Отменить</button>`;
    } else {
      actions = `<button class="btn btn-undo" onclick="undoOrder('${o._id}','${o.status}',JSON.parse(decodeURIComponent('${itemsJson}')))">↩ Отменить</button>`;
    }
    const customerInfo = o.customerName ? `<div class="order-ts">${o.customerName}${o.customerPhone?' · '+o.customerPhone:''}</div>` : '';
    return `<div class="order-card">
      <div class="order-header"><div><div class="order-id">${o.orderId||o._id}</div><div class="order-ts">${fmtTime(o.createdAt)}</div>${customerInfo}</div><span class="status-badge status-${o.status}">${labels[o.status]||o.status}</span><div class="order-total">₾${o.total}</div></div>
      <div class="order-items">${itemsHtml}</div>
      <div class="order-actions">${actions}</div>
    </div>`;
  }).join('');
}

// ── INVENTORY ─────────────────────────────────────────
window.toggleSold = async (firestoreId, currentSold) => { await updateDoc(doc(db,"products",firestoreId),{sold:!currentSold}); };
window.deleteProduct = async (firestoreId, name) => { if(confirm(`Удалить "${name}"?`)) await deleteDoc(doc(db,"products",firestoreId)); };

function renderInventory() {
  const grid = document.getElementById('inventoryGrid');
  if (!products.length) { grid.innerHTML='<div class="empty-state"><div class="icon">📦</div>Товаров нет. Добавьте первый!</div>'; return; }
  grid.innerHTML = products.map(p=>`<div class="inv-card${p.sold?' is-sold':''}">
    <div class="inv-emoji">${p.emoji||'🛍️'}</div>
    <div class="inv-info"><div class="inv-sku">${p.id}</div><div class="inv-name">${p.name?.ru||''}</div><div class="inv-price">₾${p.price}</div></div>
    <div class="inv-flags">${p.isNew?'🆕':''}${p.isSale?'🏷️':''}</div>
    <button class="toggle-btn ${p.sold?'off':'on'}" onclick="toggleSold('${p._id}',${!!p.sold})" title="${p.sold?'Вернуть в продажу':'Пометить как продано'}"></button>
    <button class="inv-edit" onclick="openEditModal('${p._id}')" title="Редактировать">✏️</button>
    <button class="inv-delete" onclick="deleteProduct('${p._id}','${(p.name?.ru||'').replace(/'/g,"\\'")}')">🗑</button>
  </div>`).join('');
}

// ── STATS ─────────────────────────────────────────────
function renderStats() {
  const pending = orders.filter(o=>o.status==='messenger_pending'||o.status==='pending').length;
  const confirmed = orders.filter(o=>o.status==='confirmed').length;
  const sold = products.filter(p=>p.sold).length;
  document.getElementById('s-pending').textContent = pending;
  document.getElementById('s-confirmed').textContent = confirmed;
  document.getElementById('s-sold').textContent = sold;
  document.getElementById('s-available').textContent = products.length - sold;
  const badge = document.getElementById('pendingBadge');
  badge.textContent = pending; badge.style.display = pending>0?'inline-flex':'none';
}

// ── ADD PRODUCT ───────────────────────────────────────
window.addProduct = async () => {
  const id = document.getElementById('f-id').value.trim();
  const cat = document.getElementById('f-cat').value;
  const emoji = document.getElementById('f-emoji').value.trim()||'🛍️';
  const price = parseFloat(document.getElementById('f-price').value);
  const nameRu = document.getElementById('f-name-ru').value.trim();
  const nameEn = document.getElementById('f-name-en').value.trim();
  const nameGe = document.getElementById('f-name-ge').value.trim();
  const descRu = document.getElementById('f-desc-ru').value.trim();
  const isNew = document.getElementById('f-isNew').checked;
  const isSale = document.getElementById('f-isSale').checked;
  if (!id||!nameRu||!price) { alert('Заполни артикул, название и цену!'); return; }
  if (products.find(p=>p.id===id)) { alert(`Артикул ${id} уже существует!`); return; }
  await addDoc(collection(db,"products"),{ id, cat, emoji, price, sold:false, isNew, isSale, name:{ru:nameRu,en:nameEn,ge:nameGe}, desc:{ru:descRu,en:'',ge:''}, createdAt:serverTimestamp() });
  ['f-id','f-emoji','f-price','f-name-ru','f-name-en','f-name-ge','f-desc-ru'].forEach(id=>{ document.getElementById(id).value=''; });
  document.getElementById('f-isNew').checked = false;
  document.getElementById('f-isSale').checked = false;
  alert(`Товар ${id} добавлен!`);
};

// ── EDIT PRODUCT ──────────────────────────────────────
let editingId = null;

window.openEditModal = firestoreId => {
  const p = products.find(x => x._id === firestoreId);
  if (!p) return;
  editingId = firestoreId;
  document.getElementById('e-id').value = p.id;
  document.getElementById('e-cat').value = p.cat || 'other';
  document.getElementById('e-emoji').value = p.emoji || '';
  document.getElementById('e-price').value = p.price || '';
  document.getElementById('e-name-ru').value = p.name?.ru || '';
  document.getElementById('e-name-en').value = p.name?.en || '';
  document.getElementById('e-name-ge').value = p.name?.ge || '';
  document.getElementById('e-desc-ru').value = p.desc?.ru || '';
  document.getElementById('e-isNew').checked = !!p.isNew;
  document.getElementById('e-isSale').checked = !!p.isSale;
  document.getElementById('editModal').classList.add('open');
};

window.closeEditModal = () => {
  editingId = null;
  document.getElementById('editModal').classList.remove('open');
};

window.saveProduct = async () => {
  if (!editingId) return;
  const price = parseFloat(document.getElementById('e-price').value);
  const nameRu = document.getElementById('e-name-ru').value.trim();
  if (!nameRu || !price) { alert('Заполни название и цену!'); return; }
  await updateDoc(doc(db, 'products', editingId), {
    cat: document.getElementById('e-cat').value,
    emoji: document.getElementById('e-emoji').value.trim() || '🛍️',
    price,
    name: { ru: nameRu, en: document.getElementById('e-name-en').value.trim(), ge: document.getElementById('e-name-ge').value.trim() },
    desc: { ru: document.getElementById('e-desc-ru').value.trim(), en: '', ge: '' },
    isNew: document.getElementById('e-isNew').checked,
    isSale: document.getElementById('e-isSale').checked,
  });
  closeEditModal();
};
</script>

<div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal-box">
    <div class="modal-title">Редактировать товар</div>
    <div class="form-grid">
      <div class="form-field"><label>Артикул</label><input id="e-id" disabled style="opacity:0.55;cursor:default"></div>
      <div class="form-field"><label>Категория</label>
        <select id="e-cat">
          <option value="wallets">Кошельки и сумки</option>
          <option value="perfume">Духи и красота</option>
          <option value="accessories">Аксессуары</option>
          <option value="other">Другое</option>
        </select>
      </div>
      <div class="form-field"><label>Эмодзи</label><input id="e-emoji" maxlength="2"></div>
      <div class="form-field"><label>Цена (₾)</label><input id="e-price" type="number"></div>
      <div class="form-field"><label>Название (RU)</label><input id="e-name-ru"></div>
      <div class="form-field"><label>Название (EN)</label><input id="e-name-en"></div>
      <div class="form-field"><label>Название (GE)</label><input id="e-name-ge"></div>
      <div class="form-field"><label>Описание (RU)</label><input id="e-desc-ru"></div>
      <div class="form-field checkbox"><input type="checkbox" id="e-isNew"><label for="e-isNew">🆕 Новинка</label></div>
      <div class="form-field checkbox"><input type="checkbox" id="e-isSale"><label for="e-isSale">🏷️ Скидка</label></div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeEditModal()">Отмена</button>
      <button class="btn-modal-save" onclick="saveProduct()">Сохранить</button>
    </div>
  </div>
</div>
</body>
</html>
